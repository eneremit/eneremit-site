<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>eneremit</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f5f5f0;
  --text: #2a2a2a;
  --text-light: #666;
  --icon: #613d12;
  --icon-hover: #3f280c;
  --accent: #613d12;
  --accent-dark: #4a2f0d;
  --border: #ddd;
  --widget-label: #222222;
  --chrome: rgba(42,42,42,0.68);
  --widget-value: #613d12;
}

html, body {
  min-height: 100%;
  font-family: "Times New Roman", Times, Georgia, serif;
  background: var(--bg);
  color: var(--text);
}

.page-wrap {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 28px 60px;
}

.title {
  font-size: 20px;
  letter-spacing: 2.5px;
  font-weight: normal;
  color: var(--chrome);
  cursor: pointer;
  transition: opacity .3s ease;
  user-select: none;
  background: none; border: none; font-family: inherit;
  margin-bottom: 32px;
}
.title:hover { opacity: .7; }
.title:has(+ .info-panel.active) { margin-bottom: 4px; }

/* INFO PANEL — pushes content down naturally when open, no overlay trick */
.info-panel {
  width: 100%;
  max-width: 400px;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height .4s ease, opacity .3s ease, margin .4s ease;
}
.info-panel.active { max-height: 90px; opacity: 1; margin-bottom: 22px; }

.bio-name {
  font-size: 13px;
  color: var(--chrome);
  text-align: center;
  letter-spacing: 0.3px;
  margin-top: 2px;
}
.bio-location {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 13px;
  color: var(--chrome);
  margin: 6px 0 24px;
}
.bio-location svg { width: 12px; height: 12px; fill: var(--icon); flex-shrink: 0; }
.panel-center { display: flex; flex-direction: column; align-items: center; }

/* WIDGET — deliberately the simplest possible technique: plain inline
   text flow, no grid, no flex. Nothing here can stretch or leave a gap —
   the value just follows the label the way text naturally does. Rows
   stack as block-level siblings, so labels start flush-left automatically. */
#eneremit-activity-widget {
  width: fit-content;
  max-width: min(380px, 88vw);
  margin: 4px auto 30px;
  font-family: inherit;
  font-size: 13px;
  line-height: 1.7;
}
.eneremit-row {
  margin-top: 0.3em;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.eneremit-row:first-child { margin-top: 0; }
.eneremit-label {
  color: var(--chrome); font-weight: 400;
}
#eneremit-activity-widget .eneremit-value {
  color: var(--widget-value); font-weight: 400; text-decoration: none;
  margin-left: 0.4em;
}
#eneremit-activity-widget .eneremit-value:hover {
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
}

/* MAIN ICON ROW — 4 icons, fixed, never wraps */
.icons-row {
  display: flex;
  align-items: center; justify-content: center;
  gap: 20px;
  flex-wrap: nowrap;
  width: 100%;
  margin-bottom: 30px;
}
.icon-link {
  display: flex; align-items: center; justify-content: center;
  width: 20px; height: 20px;
  flex-shrink: 0;
  color: var(--icon);
  text-decoration: none;
  transition: all .3s ease;
  flex-shrink: 0;
}
.icon-link:hover { color: var(--icon-hover); transform: scale(1.12); }
.icon-link svg { width: 100%; height: 100%; fill: currentColor; display: block; }

/* SEARCH — no box, no border. A search icon in the row above triggers a
   plain-text prompt that becomes a live input, instead of a persistent bar */
.search-panel {
  width: 100%; max-width: 380px;
  overflow: hidden; max-height: 0; opacity: 0;
  transition: max-height .3s ease, opacity .25s ease, margin .3s ease;
}
.search-panel.open { max-height: 420px; opacity: 1; margin-top: 6px; }
.search-panel input {
  display: block; width: 100%; text-align: center;
  font-family: inherit; font-size: 14px; color: var(--text);
  padding: .4rem 0;
  border: none;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
.search-panel input::placeholder { color: var(--text-light); font-style: italic; }

.search-results {
  margin-top: 10px;
  max-height: 0;
  overflow-y: auto;
  transition: max-height .25s ease;
}
.search-results.open { max-height: 320px; }
.result-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 4px;
  text-decoration: none;
  color: var(--text);
  font-size: 13px;
  transition: opacity .15s ease;
}
.result-row:hover { opacity: 0.6; }
.result-empty { font-size: 12px; color: var(--text-light); font-style: normal; padding: 6px 4px; }

/* RESPONSIVE */
@media (max-width: 480px) {
  .page-wrap { padding: 50px 20px 50px; }
  .title { font-size: 18px; letter-spacing: 2px; }
  .icons-row { gap: 14px; margin-bottom: 26px; }
  .icon-link { width: 18px; height: 18px; }
  #eneremit-activity-widget { font-size: 12px; margin: 2px auto 24px; }
}
@media (max-width: 360px) {
  .icons-row { gap: 10px; }
  .icon-link { width: 17px; height: 17px; }
}
@media (max-width: 330px) {
  .icons-row { gap: 7px; }
  .icon-link { width: 16px; height: 16px; }
}
@media (min-width: 768px) {
  .page-wrap { padding: 90px 40px; max-width: 600px; }
  #eneremit-activity-widget { max-width: 420px; }
  .search-panel { max-width: 420px; }
}

::-webkit-scrollbar { display: none; }
</style>
<base target="_blank">
</head>
<body>

<script>
// ===== INFO PANEL (bio + location) =====
const trigger = document.getElementById('donationTrigger');
const panel = document.getElementById('infoPanel');
trigger.addEventListener('click', () => panel.classList.toggle('active'));

// ===== WIDGET =====
const WIDGET_ENDPOINT = 'https://eneremit-widget.eneremit.workers.dev/json';
async function fetchWidgetData() {
  try {
    const res = await fetch(WIDGET_ENDPOINT, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('fetch failed');
    updateWidget(await res.json());
  } catch (err) { console.log('Widget fetch error:', err); }
}
function updateWidget(data) {
  if (data.lastfm) {
    const label = document.getElementById('eneremit-lfm-label');
    const val = document.getElementById('eneremit-lfm-text');
    if (data.lastfm.label) label.textContent = data.lastfm.label;
    if (data.lastfm.text) val.textContent = data.lastfm.text;
    val.href = data.lastfm.itemUrl || data.lastfm.url || val.href;
  }
  if (data.goodreads) {
    const label = document.getElementById('eneremit-gr-label');
    const val = document.getElementById('eneremit-gr-text');
    if (data.goodreads.label) label.textContent = data.goodreads.label;
    if (data.goodreads.text) val.textContent = data.goodreads.text;
    val.href = data.goodreads.itemUrl || data.goodreads.url || val.href;
  }
  if (data.letterboxd) {
    const label = document.getElementById('eneremit-lb-label');
    const val = document.getElementById('eneremit-lb-text');
    if (data.letterboxd.label) label.textContent = data.letterboxd.label;
    if (data.letterboxd.text) val.textContent = data.letterboxd.text;
    val.href = data.letterboxd.itemUrl || data.letterboxd.url || val.href;
  }
}
fetchWidgetData();
setInterval(fetchWidgetData, 120000);

// ===== SOCIAL DIRECTORY SEARCH =====
// StoryGraph intentionally left out — no link provided yet.
const directory = [
  {label:"Last.fm", url:"https://www.last.fm/user/eneremit", tags:"lastfm music scrobble"},
  {label:"Apple Music", url:"https://music.apple.com/profile/eneremit", tags:"applemusic music apple"},
  {label:"Strava", url:"https://strava.app.link/rjUvQDrUO4b", tags:"running fitness"},
  {label:"Serializd", url:"https://srlzd.com/u/eneremit", tags:"tv shows"},
  {label:"RYM (Rate Your Music)", url:"https://rateyourmusic.com/~eneremit", tags:"rym rateyourmusic music"},
  {label:"Musicboard", url:"https://musicboard.app/eneremit?rel=copy", tags:"music"},
  {label:"AOTY (Album Of The Year)", url:"https://www.albumoftheyear.org/user/eneremit/#", tags:"aoty albumoftheyear music"},
  {label:"Airbuds", url:"https://i.airbuds.fm/eneremit/40LUzVuzP3", tags:"music spotify stats"},
  {label:"Stats.fm", url:"https://stats.fm/invite/eneremit", tags:"statsfm music spotify stats"},
  {label:"Discogs", url:"https://www.discogs.com/user/eneremit", tags:"vinyl records music"},

  {label:"Blu-ray.com", url:"https://www.blu-ray.com/community/profile.php?u=996279", tags:"bluray movies physical media"},
  {label:"Trakt", url:"https://app.trakt.tv/profile/eneremit", tags:"tv movies tracking"},
  {label:"Goodreads", url:"https://www.goodreads.com/user/show/138343303-julian", tags:"books reading"},
  {label:"Fable", url:"https://fable.co/fabler/julian-585019491620?referralID=IauSlIaWZ4", tags:"books reading"},
  {label:"YouTube", url:"https://youtube.com/@eneremio?si=E14hXLwFrPDZDUaK", tags:"video yt"},
  {label:"TikTok", url:"https://www.tiktok.com/@eneremio?_r=1&_t=ZT-9854xvFRxxV", tags:""},
  {label:"Plex", url:"https://l.plex.tv/zJ7FfGr", tags:"movies tv media server"},
  {label:"Mubi", url:"https://mubi.com/en/users/16232901", tags:"movies film"},
  {label:"WhatsApp", url:"https://wa.me/qr/OWAAKIQIBB3WE1", tags:"wa message"},
  {label:"Telegram", url:"https://t.me/eneremio", tags:"message"},
  {label:"PayPal", url:"https://www.paypal.com/paypalme/chembofio", tags:"tip donate payment"},
  {label:"Instagram", url:"https://www.instagram.com/mogollero/", tags:"ig"},
  {label:"Secondary Instagram", url:"https://www.instagram.com/eneremit/", tags:"instagram ig secondary alt"},
  {label:"Reddit", url:"https://www.reddit.com/u/InfamousString3984/s/6EMa7svHUa", tags:""},

  {label:"Tumblr", url:"https://eneremio.tumblr.com/", tags:"blog"},
  {label:"StoryGraph", url:"https://app.thestorygraph.com/profile/eneremit", tags:"books reading thestorygraph"},
  {label:"Letterboxd", url:"https://boxd.it/2wBWz", tags:"movies film"}
];

directory.forEach(e => {
  e.haystack = (e.label + ' ' + e.tags).toLowerCase();
});

const searchInput = document.getElementById('socialSearch');
const resultsBox = document.getElementById('searchResults');

function renderResults(query) {
  const q = query.trim().toLowerCase();
  if (!q) { resultsBox.classList.remove('open'); resultsBox.innerHTML = ''; return; }

  const matches = directory.filter(e =>
    e.haystack.split(/[^a-z0-9]+/).some(tok => tok && tok.startsWith(q))
  );

  if (!matches.length) {
    resultsBox.innerHTML = '<div class="result-empty">no matches</div>';
  } else {
    resultsBox.innerHTML = matches.map(e => `
      <a class="result-row" href="${e.url}" target="_blank" rel="noopener">
        <span>${e.label}</span>
      </a>
    `).join('');
  }
  resultsBox.classList.add('open');
}

searchInput.addEventListener('input', () => renderResults(searchInput.value));
searchInput.addEventListener('focus', () => { if (searchInput.value) resultsBox.classList.add('open'); });

const searchToggle = document.getElementById('searchToggle');
const searchPanel = document.getElementById('searchPanel');
searchToggle.addEventListener('click', (e) => {
  e.preventDefault();
  searchPanel.classList.toggle('open');
  if (searchPanel.classList.contains('open')) searchInput.focus();
});
</script>
</body>
