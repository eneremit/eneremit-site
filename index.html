<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f5f5f0;
  --text: #2a2a2a;
  --text-light: #666;
  --icon: #613d12;
  --icon-hover: #3f280c;
  --accent: #613d12;
  --accent-dark: #4a2f0d;
  --border: #ddd;
  --widget-label: #222222;
  --widget-value: #613d12;
}

html, body {
  min-height: 100%;
  font-family: "Times New Roman", Times, Georgia, serif;
  background: var(--bg);
  color: var(--text);
}

.page-wrap {
  position: relative;
  width: 100%;
  min-height: 100vh;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 28px 60px;
}

.title {
  font-size: 20px;
  letter-spacing: 2.5px;
  font-weight: normal;
  color: var(--text);
  opacity: 0.68;
  cursor: pointer;
  transition: opacity .3s ease;
  user-select: none;
  background: none; border: none; font-family: inherit;
  margin-bottom: 26px;
}
.title:hover { opacity: .45; }

/* INFO PANEL — pushes content down naturally when open, no overlay trick */
.info-panel {
  width: 100%;
  max-width: 400px;
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition: max-height .4s ease, opacity .3s ease, margin .4s ease;
}
.info-panel.active { max-height: 420px; opacity: 1; margin-bottom: 12px; }

.bio-name {
  font-size: 15px;
  color: var(--text);
  text-align: center;
  letter-spacing: 0.3px;
  margin-top: 14px;
}
.bio-location {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 15px;
  color: var(--text-light);
  margin: 8px 0 30px;
}
.bio-location svg { width: 13px; height: 13px; fill: var(--icon); flex-shrink: 0; }
.tip-amounts { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.tip-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1.5px solid var(--accent-dark);
  background: transparent; color: var(--text);
  font-family: inherit; font-size: 12px; cursor: pointer;
  transition: all .3s ease;
}
.tip-btn:hover, .tip-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
.custom-amount, .message-box {
  width: 100%; padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: transparent; font-family: inherit; font-size: 12px; color: var(--text);
  margin: 0 auto 10px; display: block; text-align: center; outline: none;
  transition: border-color .3s;
}
.message-box { resize: vertical; min-height: 42px; text-align: left; }
.custom-amount:focus, .message-box:focus { border-color: var(--accent-dark); }
.custom-amount::placeholder, .message-box::placeholder { color: #bbb; font-style: italic; }
.panel-center { display: flex; flex-direction: column; align-items: center; }
.paypal-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 24px; background: var(--accent); color: #fff;
  border: none; border-radius: 3px;
  font-family: inherit; font-size: 13px; letter-spacing: 1px;
  cursor: pointer; text-decoration: none; transition: all .3s ease;
}
.paypal-btn:hover { background: var(--accent-dark); }
.paypal-btn svg { width: 15px; height: 15px; fill: currentColor; }
.close-panel {
  display: block; margin: 14px auto 0; font-size: 11px; letter-spacing: 1px;
  color: var(--text-light); background: none; border: none; cursor: pointer; font-family: inherit;
}
.close-panel:hover { color: var(--text); }

/* WIDGET — bigger, grid-left-aligned like the Tumblr sidebar, centered as one block */
#eneremit-activity-widget {
  width: 100%;
  max-width: 380px;
  margin: 4px 0 30px;
  font-family: inherit;
  font-size: 13px;
  line-height: 1.7;
}
#eneremit-activity-widget .eneremit-row {
  display: grid;
  grid-template-columns: max-content minmax(0,1fr);
  align-items: baseline;
  gap: 0.4em;
  margin-top: 0.3em;
}
#eneremit-activity-widget .eneremit-row:first-child { margin-top: 0; }
#eneremit-activity-widget .eneremit-label {
  color: var(--widget-label); font-weight: 400; white-space: nowrap;
}
#eneremit-activity-widget .eneremit-value {
  color: var(--widget-value); font-weight: 400; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none;
}
#eneremit-activity-widget .eneremit-value:hover {
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
}

/* MAIN ICON ROW — 4 icons, fixed, never wraps */
.icons-row {
  display: flex;
  align-items: center; justify-content: center;
  gap: 20px;
  flex-wrap: nowrap;
  width: 100%;
  margin-bottom: 30px;
}
.icon-link {
  display: flex; align-items: center; justify-content: center;
  width: 20px; height: 20px;
  flex-shrink: 0;
  color: var(--icon);
  text-decoration: none;
  transition: all .3s ease;
  flex-shrink: 0;
}
.icon-link:hover { color: var(--icon-hover); transform: scale(1.12); }
.icon-link svg { width: 100%; height: 100%; fill: currentColor; display: block; }

/* SEARCH — styled after the Tumblr sidebar search form */
.search-wrap { width: 100%; max-width: 380px; }
.search-form {
  display: flex; align-items: center;
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  transition: border-color .2s ease;
  background: transparent;
}
.search-form:focus-within { border-color: var(--accent); }
.search-icon-btn {
  display: flex; align-items: center; justify-content: center;
  padding: 0 12px;
  align-self: stretch;
  border-right: 1px solid var(--border);
  color: var(--icon);
  background: rgba(97,61,18,0.04);
}
.search-icon-btn svg { width: 15px; height: 15px; }
#socialSearch {
  flex: 1; min-width: 0;
  border: none; outline: none; background: transparent;
  font-family: inherit; font-size: 13px; color: var(--text);
  padding: 10px 14px;
}
#socialSearch::placeholder { color: #999; font-style: italic; }

.search-results {
  margin-top: 10px;
  max-height: 0;
  overflow-y: auto;
  transition: max-height .25s ease;
}
.search-results.open { max-height: 220px; }
.result-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 4px;
  text-decoration: none;
  color: var(--text);
  font-size: 13px;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  transition: opacity .15s ease;
}
.result-row:last-child { border-bottom: none; }
.result-row:hover { opacity: 0.6; }
.result-empty { font-size: 12px; color: var(--text-light); font-style: italic; padding: 6px 4px; }

/* RESPONSIVE */
@media (max-width: 480px) {
  .page-wrap { padding: 50px 20px 50px; }
  .title { font-size: 18px; letter-spacing: 2px; }
  .icons-row { gap: 14px; margin-bottom: 26px; }
  .icon-link { width: 18px; height: 18px; }
  #eneremit-activity-widget { font-size: 12px; margin: 2px 0 24px; }
}
@media (max-width: 360px) {
  .icons-row { gap: 10px; }
  .icon-link { width: 17px; height: 17px; }
}
@media (max-width: 330px) {
  .icons-row { gap: 7px; }
  .icon-link { width: 16px; height: 16px; }
}
@media (min-width: 768px) {
  .page-wrap { padding: 90px 40px; max-width: 600px; }
  #eneremit-activity-widget { max-width: 420px; }
  .search-wrap { max-width: 420px; }
}

::-webkit-scrollbar { display: none; }
</style>

<script>
// ===== INFO PANEL =====
const trigger = document.getElementById('donationTrigger');
const panel = document.getElementById('infoPanel');
const closeBtn = document.getElementById('closePanel');
trigger.addEventListener('click', () => panel.classList.toggle('active'));
closeBtn.addEventListener('click', () => panel.classList.remove('active'));

const tipBtns = document.querySelectorAll('.tip-btn');
const customAmount = document.getElementById('customAmount');
const tipMessage = document.getElementById('tipMessage');
const paypalBtn = document.getElementById('paypalBtn');
let selectedAmount = '';

tipBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    selectedAmount = btn.dataset.amount;
    customAmount.value = '';
    tipBtns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    updatePaypalLink();
  });
});
customAmount.addEventListener('input', () => {
  selectedAmount = customAmount.value.replace(/[^0-9.]/g, '');
  tipBtns.forEach(b => b.classList.remove('selected'));
  updatePaypalLink();
});
tipMessage.addEventListener('input', updatePaypalLink);
function updatePaypalLink() {
  const amount = selectedAmount || customAmount.value.replace(/[^0-9.]/g, '') || '';
  const message = encodeURIComponent(tipMessage.value || '');
  let url = 'https://www.paypal.com/paypalme/chembofio';
  if (amount) { url += '/' + amount; if (message) url += '/' + message; }
  paypalBtn.href = url;
}

// ===== WIDGET =====
const WIDGET_ENDPOINT = 'https://eneremit-widget.eneremit.workers.dev/json';
async function fetchWidgetData() {
  try {
    const res = await fetch(WIDGET_ENDPOINT, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('fetch failed');
    updateWidget(await res.json());
  } catch (err) { console.log('Widget fetch error:', err); }
}
function updateWidget(data) {
  if (data.lastfm) {
    const label = document.getElementById('eneremit-lfm-label');
    const val = document.getElementById('eneremit-lfm-text');
    if (data.lastfm.label) label.textContent = data.lastfm.label;
    if (data.lastfm.text) val.textContent = data.lastfm.text;
    val.href = data.lastfm.itemUrl || data.lastfm.url || val.href;
  }
  if (data.goodreads) {
    const label = document.getElementById('eneremit-gr-label');
    const val = document.getElementById('eneremit-gr-text');
    if (data.goodreads.label) label.textContent = data.goodreads.label;
    if (data.goodreads.text) val.textContent = data.goodreads.text;
    val.href = data.goodreads.itemUrl || data.goodreads.url || val.href;
  }
  if (data.letterboxd) {
    const label = document.getElementById('eneremit-lb-label');
    const val = document.getElementById('eneremit-lb-text');
    if (data.letterboxd.label) label.textContent = data.letterboxd.label;
    if (data.letterboxd.text) val.textContent = data.letterboxd.text;
    val.href = data.letterboxd.itemUrl || data.letterboxd.url || val.href;
  }
}
fetchWidgetData();
setInterval(fetchWidgetData, 120000);

// ===== SOCIAL DIRECTORY SEARCH =====
// StoryGraph intentionally left out — no link provided yet.
const directory = [
  {label:"Last.fm", url:"https://www.last.fm/user/eneremit", tags:"lastfm music scrobble"},
  {label:"Apple Music", url:"https://music.apple.com/profile/eneremit", tags:"applemusic music apple"},

  {label:"Serializd", url:"https://srlzd.com/u/eneremit", tags:"tv shows"},
  {label:"RYM (Rate Your Music)", url:"https://rateyourmusic.com/~eneremit", tags:"rym rateyourmusic music"},
  {label:"Musicboard", url:"https://musicboard.app/eneremit?rel=copy", tags:"music"},
  {label:"AOTY (Album Of The Year)", url:"https://www.albumoftheyear.org/user/eneremit/#", tags:"aoty albumoftheyear music"},
  {label:"Airbuds", url:"https://i.airbuds.fm/eneremit/40LUzVuzP3", tags:"music spotify stats"},
  {label:"Stats.fm", url:"https://stats.fm/invite/eneremit", tags:"statsfm music spotify stats"},
  {label:"Discogs", url:"https://www.discogs.com/user/eneremit", tags:"vinyl records music"},
  {label:"Beli", url:"https://beliapp.co/app/eneremit", tags:"food restaurants"},
  {label:"Blu-ray.com", url:"https://www.blu-ray.com/community/profile.php?u=996279", tags:"bluray movies physical media"},
  {label:"Trakt", url:"https://app.trakt.tv/profile/eneremit", tags:"tv movies tracking"},
  {label:"Goodreads", url:"https://www.goodreads.com/user/show/138343303-julian", tags:"books reading"},
  {label:"Fable", url:"https://fable.co/fabler/julian-585019491620?referralID=IauSlIaWZ4", tags:"books reading"},
  {label:"YouTube", url:"https://youtube.com/@eneremio?si=E14hXLwFrPDZDUaK", tags:"video yt"},

directory.forEach(e => {
  e.haystack = (e.label + ' ' + e.tags).toLowerCase();
});

const searchInput = document.getElementById('socialSearch');
const resultsBox = document.getElementById('searchResults');

function renderResults(query) {
  const q = query.trim().toLowerCase();
  if (!q) { resultsBox.classList.remove('open'); resultsBox.innerHTML = ''; return; }

  const matches = directory.filter(e =>
    e.haystack.split(/[^a-z0-9]+/).some(tok => tok && tok.startsWith(q))
  );

  if (!matches.length) {
    resultsBox.innerHTML = '<div class="result-empty">no matches</div>';
  } else {
    resultsBox.innerHTML = matches.map(e => `
      <a class="result-row" href="${e.url}" target="_blank" rel="noopener">
        <span>${e.label}</span>
      </a>
    `).join('');
  }
  resultsBox.classList.add('open');
}

searchInput.addEventListener('input', () => renderResults(searchInput.value));
searchInput.addEventListener('focus', () => { if (searchInput.value) resultsBox.classList.add('open'); });
